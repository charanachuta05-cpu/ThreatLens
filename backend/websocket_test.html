<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThreatLens WebSocket Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        #status {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #messages {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            height: 450px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            background: #eef6ff;
            border-left: 5px solid #2196f3;
            border-radius: 5px;
        }

        pre {
            margin: 5px 0 0;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>ThreatLens WebSocket Test</h1>

    <div id="status">
        🔄 Connecting...
    </div>

    <div id="messages"></div>

    <script>

        // ==========================================
        // THREATLENS WEBSOCKET CONFIGURATION
        // ==========================================

        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwiZW1haWwiOiJhZG1pbkB0aHJlYXRsZW5zLmNvbSIsInJvbGUiOiJhZG1pbiIsImV4cCI6MTc4NjE5OTk1NX0.QqLEm56643y5lWBfLNeMyCcGLYRoPmMsAPtp6fJcJLc";

        const statusDiv = document.getElementById("status");
        const messagesDiv = document.getElementById("messages");


        // ==========================================
        // TOKEN VALIDATION
        // ==========================================

        if (!token || token === "YOUR_FRESH_JWT_TOKEN_HERE") {

            console.error("🚨 JWT token is missing.");

            statusDiv.innerHTML = "❌ JWT Token Missing";

        } else {

            // ==========================================
            // WEBSOCKET URL
            // ==========================================

            const wsUrl =
                `ws://127.0.0.1:8000/ws/alerts?token=${encodeURIComponent(token)}`;

            console.log("==========================================");
            console.log("ThreatLens WebSocket");
            console.log("==========================================");

            console.log("Script Loaded");

            console.log("Connecting to:");
            console.log(
                "ws://127.0.0.1:8000/ws/alerts?token=<REDACTED>"
            );


            // ==========================================
            // CREATE WEBSOCKET CONNECTION
            // ==========================================

            const socket = new WebSocket(wsUrl);


            // ==========================================
            // CONNECTION OPEN
            // ==========================================

            socket.onopen = () => {

                console.log("✅ WebSocket Connected");

                statusDiv.innerHTML = "✅ Connected";

                addMessage({
                    event: "websocket.connected",
                    message: "Successfully connected to ThreatLens"
                });
            };


            // ==========================================
            // MESSAGE RECEIVED
            // ==========================================

            socket.onmessage = (event) => {

                console.log("📩 Raw Message:");
                console.log(event.data);

                try {

                    const data = JSON.parse(event.data);

                    addMessage(data);

                } catch (error) {

                    console.error(
                        "❌ Failed to parse WebSocket message:",
                        error
                    );

                    addMessage({
                        event: "websocket.raw_message",
                        data: event.data
                    });
                }
            };


            // ==========================================
            // CONNECTION ERROR
            // ==========================================

            socket.onerror = (event) => {

                console.error("🚨 WebSocket Error:", event);

                statusDiv.innerHTML = "🚨 WebSocket Error";
            };


            // ==========================================
            // CONNECTION CLOSED
            // ==========================================

            socket.onclose = (event) => {

                console.log("❌ Connection Closed");

                console.log("Close Code:", event.code);

                console.log("Reason:", event.reason);

                console.log("Clean:", event.wasClean);

                statusDiv.innerHTML =
                    `❌ Disconnected (Code: ${event.code})`;

                addMessage({
                    event: "websocket.closed",
                    code: event.code,
                    reason: event.reason || "No reason provided",
                    clean: event.wasClean
                });
            };
        }


        // ==========================================
        // DISPLAY MESSAGE
        // ==========================================

        function addMessage(data) {

            if (!messagesDiv) {

                console.warn(
                    "Messages container not found."
                );

                return;
            }

            const div = document.createElement("div");

            div.className = "message";

            const timestamp =
                new Date().toLocaleTimeString();

            const pre =
                document.createElement("pre");

            pre.textContent =
                JSON.stringify(data, null, 2);

            const strong =
                document.createElement("strong");

            strong.textContent =
                timestamp;

            div.appendChild(strong);

            div.appendChild(pre);

            messagesDiv.prepend(div);
        }

    </script>

</body>
</html>
